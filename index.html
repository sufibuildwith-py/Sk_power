      "image": "/logo.jpeg",

        "addressLocality": "Varanasi",
        "addressRegion": "Uttar Pradesh",
        "addressCountry": "IN"
      },
      "areaServed": [
        {
          "@type": "City",
          "name": "Varanasi"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Uttar Pradesh"
        }
      ],
      "knowsAbout": [
        "Residential Rooftop Solar",
        "PM Surya Ghar Muft Bijli Yojana Assistance",

      ]
    }

  <body class="bg-[#8ba3b3] text-solar-charcoal antialiased selection:bg-solar-amber/25 selection:text-solar-ink overflow-x-hidden">
